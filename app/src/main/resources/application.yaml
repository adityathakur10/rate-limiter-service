server:
  port: 8080

spring:
  application:
    name: rate-limiter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ratelimiter}
    username: ${DB_USERNAME:ratelimiter}
    password: ${DB_PASSWORD:ratelimiter}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
