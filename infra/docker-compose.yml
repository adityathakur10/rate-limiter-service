services:
  postgres:
    # bookworm (Debian 12) keeps legacy tz names like Asia/Calcutta that JVM clients send;
    # the default Debian 13 image dropped them and rejects those connections
    image: postgres:16-bookworm
    container_name: ratelimiter-postgres
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ratelimiter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter -d ratelimiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # no volume: counters are short-lived (TTL = window) and caches repopulate from Postgres
    image: redis:7-alpine
    container_name: ratelimiter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
